# Include inside every location that uses add_header (nginx drops parent
# add_header when a location defines its own).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Turnstile + Next inline boot script + same-origin API/SSE.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://upidown.nishal.dev https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'" always;
