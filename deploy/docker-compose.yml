# Hard caps keep UPI Down from starving NMhelper on the shared KVM 2.
# cpu_shares 256 (default 1024) means host processes win every CPU contest.
name: upidown

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3020
      DATABASE_URL: postgres://upidown:${POSTGRES_PASSWORD}@postgres:5432/upidown
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:3020:3020"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    cpus: 0.5
    mem_limit: 384m
    cpu_shares: 256
    pids_limit: 128
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: upidown
      POSTGRES_DB: upidown
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres -c shared_buffers=128MB -c effective_cache_size=256MB
      -c max_connections=20 -c work_mem=4MB -c synchronous_commit=off
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upidown"]
      interval: 5s
      retries: 10
    cpus: 0.5
    mem_limit: 512m
    cpu_shares: 256
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports: ["127.0.0.1:6390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    cpus: 0.25
    mem_limit: 192m
    cpu_shares: 256
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

volumes:
  pgdata:
