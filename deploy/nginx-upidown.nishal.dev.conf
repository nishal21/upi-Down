# /etc/nginx/sites-available/upidown.nishal.dev  (symlink into sites-enabled)
# Zones are prefixed upidown_ so they never collide with other sites on the box.

limit_req_zone  $binary_remote_addr zone=upidown_report:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=upidown_api:10m    rate=10r/s;
limit_conn_zone $server_name        zone=upidown_sse_total:1m;
limit_conn_zone $binary_remote_addr zone=upidown_sse_ip:10m;
proxy_cache_path /var/cache/nginx/upidown levels=1 keys_zone=upidown_micro:5m max_size=50m inactive=1m;

server {
    listen 80;
    listen [::]:80;
    server_name upidown.nishal.dev;
    return 301 https://$host$request_uri;
}

server {
    # Older nginx: http2 on the listen line (not `http2 on;`)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name upidown.nishal.dev;

    # Cloudflare Origin Certificate (SSL/TLS mode: Full (strict))
    ssl_certificate     /etc/ssl/cloudflare/upidown.pem;
    ssl_certificate_key /etc/ssl/cloudflare/upidown.key;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    root /opt/upi-down/web/out;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }

    # Link-preview crawlers fetch this; keep it fast and correctly typed.
    location = /og.jpg {
        default_type image/jpeg;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=60";
    }
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    # --- API ---
    location = /api/status/stream {
        limit_conn upidown_sse_total 2000;
        limit_conn upidown_sse_ip 4;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location = /api/report {
        limit_req zone=upidown_report burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/status {
        limit_req zone=upidown_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache upidown_micro;
        proxy_cache_valid 200 3s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header Cache-Control "public, max-age=5";
    }

    location /api/ {
        limit_req zone=upidown_api burst=20 nodelay;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
